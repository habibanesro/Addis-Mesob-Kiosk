
<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizations - Addis Mesob</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">

    <div class="header-left">
        <h2>KOLFE CENTER</h2>
    </div>

    <div class="header-center">
        <img src="images/Logo.png"
             class="logo"
             alt="Addis Mesob Logo">

        <div class="header-title">
            <h1>ADDIS MESOB</h1>
            <h2>ONE CENTER DIGITAL GOVERNMENT SERVICE</h2>
        </div>
    </div>

    <div class="header-right">
        <div id="current-date"></div>
        <div id="current-time"></div>
    </div>

</header>

<main class="main-content">

    <div class="welcome-section">
        <h1 id="floor-title">የድርጅቶች ዝርዝር</h1>
        <p>የሚፈልጉትን ድርጅት ይምረጡ</p>
    </div>

    <div id="organizations" class="cards"></div>

    <button class="back" onclick="window.location.href='index.html'">
        ← ወደ ዋና ገጽ ተመለስ
    </button>

</main>

<footer class="main-footer">
    <div class="footer-content">
        <div>
            <strong>ADDIS MESOB</strong>
            <span>ONE CENTER DIGITAL GOVERNMENT SERVICE</span>
        </div>
        <div class="footer-right">
            <span>Customer Information & Service Guide</span>
            <span>Kolfe Branch | Addis Ababa, Ethiopia</span>
        </div>
    </div>
</footer>

<script src="js/data.js"></script>

<script>

const floor = localStorage.getItem("selectedFloor");
const selected = floors.find(x => x.id == floor);

const box = document.getElementById("organizations");

if (!selected) {
    box.innerHTML = "<h2>የወለሉ መረጃ አልተገኘም</h2>";
} else {

    document.getElementById("floor-title").textContent = selected.name;

    selected.organizations.forEach((org, index) => {

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <img src="${org.logo}" alt=""
                 onerror="this.style.display='none'">
            <h2></h2>
            <p>አገልግሎቶችን ለማየት ይጫኑ</p>
        `;

        card.querySelector("h2").textContent = org.name;

        card.onclick = function() {
            localStorage.setItem("organization", index);
            window.location.href = "service.html";
        };

        box.appendChild(card);

    });

}


function updateDateTime() {
    const now = new Date();

    document.getElementById("current-date").textContent =
        now.toLocaleDateString("en-GB", {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric"
        });

    document.getElementById("current-time").textContent =
        now.toLocaleTimeString("en-GB", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false
        });
}

updateDateTime();
setInterval(updateDateTime, 1000);
</script>
</body>
</html>
