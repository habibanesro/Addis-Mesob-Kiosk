
<!DOCTYPE html>
<html lang="am">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addis Mesob - Kolfe Branch</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

 <header class="header">

    <div class="header-left">
        <h2>KOLFE CENTER</h2>
    </div>

    <div class="header-center">
        <img src="images/Logo.png"
             class="logo"
             alt="Addis Mesob Logo">

        <div class="header-title">
            <h1>ADDIS MESOB</h1>
            <h2>ONE CENTER DIGITAL GOVERNMENT SERVICE</h2>
        </div>
    </div>

    <div class="header-right">
        <div id="current-date"></div>
        <div id="current-time"></div>
    </div>

</header>

    <main class="main-content">

        <div class="welcome-section">
            <h1>እንኳን ወደ አዲስ መሶብ በደህና መጡ</h1>

            <p>የሚፈልጉትን ወለል በመምረጥ የሚገኙ አገልግሎቶችንና
                መስፈርቶችን ይመልከቱ</p>
        </div>

        <div class="floor-buttons">

            <button onclick="openFloor(1)">
                <!-- <span class="floor-number">01</span> -->
                <span class="floor-name">🏢1ኛ ፎቅ</span>
                <span class="floor-description">FIRST FLOOR</span>
            </button>

            <button onclick="openFloor(2)">
                <!-- <span class="floor-number">02</span> -->
                <span class="floor-name">🏢2ኛ ፎቅ</span>
                <span class="floor-description">SECOND FLOOR</span>
            </button>

            <button onclick="openFloor(3)">
                <!-- <span class="floor-number">03</span> -->
                <span class="floor-name">🏢3ኛ ፎቅ</span>
                <span class="floor-description">THIRD FLOOR</span>
            </button>

            <button onclick="openFloor(4)">
                <!-- <span class="floor-number">04</span> -->
                <span class="floor-name">🏢4ኛ ፎቅ</span>
                <span class="floor-description">FOURTH FLOOR</span>
            </button>

        </div>

    </main>

    <footer class="main-footer">
        <div class="footer-content">
            <div>
                <strong>ADDIS MESOB</strong>
                <span>ONE CENTER DIGITAL GOVERNMENT SERVICE</span>
            </div>

            <div class="footer-right">
                <span>Customer Information & Service Guide</span>
                <span>Kolfe Branch | Addis Ababa, Ethiopia</span>
            </div>
        </div>
    </footer>

    <script>
        function openFloor(floor) {
            localStorage.setItem("selectedFloor", floor);
            window.location.href = "organization.html";
        }

function updateDateTime() {
    const now = new Date();

    document.getElementById("current-date").textContent =
        now.toLocaleDateString("en-GB", {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric"
        });

    document.getElementById("current-time").textContent =
        now.toLocaleTimeString("en-GB", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false
        });
}

updateDateTime();
setInterval(updateDateTime, 1000);
</script>
</body>
</html>
